[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "degold-os"
version = "0.1.0"
description = "DeGold OS Bot - nucleo de decisao causal, auditavel e fail-closed (READ_ONLY/SHADOW)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
yaml = ["pyyaml>=6"]

[project.scripts]
degold = "degold_os.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "causality: testes que verificam ausencia de look-ahead e no-repaint",
]
