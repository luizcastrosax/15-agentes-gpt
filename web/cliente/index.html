<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#09090B"/>
<title>ParkFlow · Pague pelo celular</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🅿️</text></svg>"/>
<style>body{background:#000;color:#FAFAFA;font-family:'Segoe UI',system-ui,sans-serif;}#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:50;background:#09090B;}#boot .l{width:52px;height:52px;border-radius:13px;background:linear-gradient(135deg,#E8344A,#F5A623);display:flex;align-items:center;justify-content:center;font-size:26px;}#boot .sp{width:24px;height:24px;border:3px solid #2A2A30;border-top-color:#E8344A;border-radius:50%;animation:spin .8s linear infinite;}#boot p{color:#A1A1AA;font-size:13px;text-align:center;max-width:260px;}@keyframes spin{to{transform:rotate(360deg);}}</style>
</head>
<body>
<div class="phone">
  <div class="appbar">
    <div class="logo">🅿️</div>
    <div><b>ParkFlow</b><small>Pague pelo celular</small></div>
    <div class="status" id="apiStatus"><span class="d"></span> online</div>
  </div>
  <div class="screen" id="screen"></div>
  <div class="foot">Pagamento oficial via PIX · saída sem parar na cancela<br>Protótipo · dados de demonstração</div>
</div>
<div id="boot"><div class="l">🅿️</div><div class="sp"></div><p>Carregando…</p></div>
<script>
(function(){
  var SHA="e149f883c04eaad024083f995f4a31ca7a588452";
  var cdn=["https://cdn.jsdelivr.net/gh/luizcastrosax/15-agentes-gpt@"+SHA+"/","https://cdn.statically.io/gh/luizcastrosax/15-agentes-gpt/"+SHA+"/"];
  function fail(){var p=document.querySelector("#boot p");if(p)p.textContent="Falha ao carregar. Recarregue a página.";var l=document.querySelector("#boot .l");if(l)l.textContent="⚠️";}
  function css(i){var l=document.createElement("link");l.rel="stylesheet";l.href=cdn[i]+"cliente/styles.css";l.onerror=function(){if(cdn[i+1])css(i+1);};document.head.appendChild(l);}
  var files=["web/cliente/mock-api.js","cliente/client.js"];
  function js(fi,ci){var s=document.createElement("script");s.src=cdn[ci]+files[fi];s.onload=function(){if(fi+1<files.length)js(fi+1,ci);else{var b=document.getElementById("boot");if(b)b.remove();}};s.onerror=function(){if(cdn[ci+1])js(fi,ci+1);else fail();};document.body.appendChild(s);}
  css(0); js(0,0);
})();
</script>
</body>
</html>
